<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEON APEX — Moto Racing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#06090f;
    font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;color:#dff3ff;}
  canvas#game{display:block;position:fixed;inset:0;}

  /* ============ SCREENS ============ */
  .screen{
    position:fixed;inset:0;display:none;
    pointer-events:none;
    z-index:10;
  }
  .screen.active{display:block;}

  /* === Main menu === */
  #screen-menu{
    background:radial-gradient(ellipse at center, transparent 0%, rgba(3,8,16,.72) 78%);
  }
  .logo{
    position:absolute;top:12%;left:50%;transform:translateX(-50%);
    font-size:clamp(48px,8vw,110px);font-weight:900;letter-spacing:8px;
    color:#fff;text-shadow:0 0 30px rgba(80,200,255,.9),0 0 80px rgba(0,120,255,.5);
    white-space:nowrap;line-height:1;
  }
  .logo span{color:#5ad8ff;text-shadow:0 0 30px rgba(90,216,255,1),0 0 60px rgba(90,216,255,.7);}
  .subtitle{
    position:absolute;top:calc(12% + clamp(56px,9vw,124px));left:50%;transform:translateX(-50%);
    font-size:clamp(12px,1.4vw,18px);letter-spacing:12px;color:rgba(180,220,255,.55);
    font-weight:600;
  }
  .menu-nav{
    position:absolute;bottom:11%;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:12px;pointer-events:auto;width:min(320px,70vw);
  }
  .menu-nav button, .btn{
    background:rgba(8,22,40,.72);
    border:1px solid rgba(90,200,255,.42);
    border-radius:10px;
    color:#cfe9ff;font-weight:700;font-size:16px;letter-spacing:2.5px;
    padding:13px 22px;cursor:pointer;
    backdrop-filter:blur(8px);
    transition:all .18s;
    text-shadow:0 0 10px rgba(80,200,255,.5);
    pointer-events:auto;
  }
  .menu-nav button:hover, .btn:hover{
    background:rgba(20,60,110,.85);
    border-color:#5ad8ff;
    color:#fff;
    box-shadow:0 0 24px rgba(90,200,255,.55), inset 0 0 22px rgba(90,200,255,.18);
    transform:translateY(-1px);
  }
  .coins{
    position:absolute;top:22px;right:24px;
    background:rgba(8,22,40,.72);
    border:1px solid rgba(255,200,60,.42);
    border-radius:10px;padding:8px 16px;
    font-size:18px;font-weight:800;letter-spacing:1.5px;
    color:#ffd76a;text-shadow:0 0 14px rgba(255,200,60,.7);
    backdrop-filter:blur(6px);pointer-events:none;
  }

  /* === Generic header === */
  .header{
    position:absolute;top:0;left:0;right:0;
    height:70px;display:flex;align-items:center;gap:20px;
    padding:0 24px;
    background:linear-gradient(180deg, rgba(4,10,20,.94), rgba(4,10,20,0));
    pointer-events:auto;
  }
  .header h2{
    font-size:24px;letter-spacing:5px;font-weight:800;
    text-shadow:0 0 18px rgba(90,200,255,.7);
  }
  .header .coins{position:relative;top:auto;right:auto;margin-left:auto;}
  .back-btn{
    background:rgba(8,22,40,.72);
    border:1px solid rgba(90,200,255,.4);
    border-radius:8px;padding:9px 16px;
    color:#cfe9ff;font-weight:700;font-size:13px;letter-spacing:2px;
    cursor:pointer;transition:all .15s;
  }
  .back-btn:hover{background:rgba(20,60,110,.85);border-color:#5ad8ff;color:#fff;}

  /* === Garage === */
  #screen-garage{background:linear-gradient(180deg, rgba(3,8,16,.45), rgba(3,8,16,.85));}
  .garage-panel{
    position:absolute;right:32px;top:90px;bottom:32px;
    width:min(360px,42vw);
    background:rgba(6,14,26,.78);
    border:1px solid rgba(90,200,255,.3);
    border-radius:14px;
    padding:20px;overflow-y:auto;
    backdrop-filter:blur(10px);
    pointer-events:auto;
    box-shadow:0 0 40px rgba(0,120,200,.2);
  }
  .garage-panel h3{
    font-size:13px;letter-spacing:3px;color:#7ab8e8;
    margin-bottom:10px;margin-top:20px;font-weight:700;
  }
  .garage-panel h3:first-child{margin-top:0;}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .swatch{
    aspect-ratio:1;border-radius:8px;cursor:pointer;
    border:2px solid rgba(255,255,255,.15);
    transition:all .15s;position:relative;
    box-shadow:0 0 8px rgba(0,0,0,.5);
  }
  .swatch:hover{transform:scale(1.1);border-color:rgba(255,255,255,.6);}
  .swatch.selected{
    border-color:#fff;
    box-shadow:0 0 16px rgba(90,200,255,.9),0 0 0 2px rgba(90,200,255,.5);
  }
  .swatch.selected::after{
    content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:900;font-size:20px;text-shadow:0 0 6px #000;
  }
  .hint{
    position:absolute;left:32px;bottom:32px;
    color:rgba(150,190,230,.55);font-size:12px;letter-spacing:1.5px;
    pointer-events:none;
  }

  /* === Shop === */
  #screen-shop{background:linear-gradient(180deg, rgba(3,8,16,.55), rgba(3,8,16,.92));}
  .shop-tabs{
    position:absolute;top:82px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;pointer-events:auto;
  }
  .shop-tabs button{
    background:rgba(8,22,40,.72);
    border:1px solid rgba(90,200,255,.35);
    border-radius:8px;padding:9px 22px;
    color:#8ab8d8;font-weight:700;font-size:13px;letter-spacing:2px;
    cursor:pointer;transition:all .15s;
  }
  .shop-tabs button.active{background:rgba(20,60,110,.9);color:#fff;border-color:#5ad8ff;
    box-shadow:0 0 18px rgba(90,200,255,.5);}
  .shop-grid{
    position:absolute;top:140px;left:50%;transform:translateX(-50%);
    width:min(1100px,92vw);bottom:32px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:14px;overflow-y:auto;padding:6px;
    pointer-events:auto;
  }
  .shop-item{
    background:rgba(8,18,32,.8);
    border:1px solid rgba(90,200,255,.25);
    border-radius:12px;padding:14px;text-align:center;
    transition:all .18s;
  }
  .shop-item:hover{border-color:rgba(90,200,255,.7);transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(0,120,200,.3);}
  .shop-item .swatch{width:64px;height:64px;margin:0 auto 10px;border-radius:10px;
    border:2px solid rgba(255,255,255,.2);}
  .shop-item .item-name{font-size:14px;font-weight:700;letter-spacing:1.5px;margin-bottom:6px;}
  .shop-item .item-price{
    font-size:13px;font-weight:800;letter-spacing:1px;
    color:#ffd76a;text-shadow:0 0 10px rgba(255,200,60,.5);
  }
  .shop-item .item-price.owned{color:#5aff9a;text-shadow:0 0 10px rgba(90,255,150,.5);}
  .shop-item button{
    margin-top:8px;width:100%;
    background:rgba(20,60,110,.8);border:1px solid rgba(90,200,255,.5);
    border-radius:7px;padding:7px;color:#fff;font-weight:700;font-size:12px;
    letter-spacing:1.5px;cursor:pointer;transition:all .15s;
  }
  .shop-item button:hover{background:rgba(40,100,170,.95);border-color:#5ad8ff;}
  .shop-item button:disabled{opacity:.4;cursor:not-allowed;}

  /* === Leaderboard === */
  #screen-leaderboard{background:linear-gradient(180deg, rgba(3,8,16,.6), rgba(3,8,16,.95));}
  .leaderboard{
    position:absolute;top:90px;left:50%;transform:translateX(-50%);
    width:min(800px,92vw);bottom:32px;overflow-y:auto;
    pointer-events:auto;
  }
  .lb-map{
    background:rgba(8,18,32,.72);
    border:1px solid rgba(90,200,255,.3);
    border-radius:12px;padding:18px 22px;margin-bottom:14px;
    backdrop-filter:blur(8px);
  }
  .lb-map h3{
    font-size:16px;letter-spacing:3px;color:#5ad8ff;margin-bottom:12px;
    text-shadow:0 0 12px rgba(90,200,255,.6);
  }
  .lb-row{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid rgba(90,200,255,.1);
    font-variant-numeric:tabular-nums;
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-row .place{color:#ffd76a;font-weight:800;width:50px;}
  .lb-row .name{flex:1;color:#cfe9ff;font-weight:600;letter-spacing:1px;}
  .lb-row .time{color:#5aff9a;font-weight:700;text-shadow:0 0 8px rgba(90,255,150,.4);}
  .lb-empty{color:rgba(150,190,230,.5);font-style:italic;padding:6px 0;}

  /* === Maps === */
  #screen-maps{background:linear-gradient(180deg, rgba(3,8,16,.55), rgba(3,8,16,.92));}
  .maps-grid{
    position:absolute;top:100px;left:50%;transform:translateX(-50%);
    width:min(1100px,92vw);bottom:32px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;overflow-y:auto;padding:6px;pointer-events:auto;
  }
  .map-card{
    background:rgba(8,18,32,.8);
    border:2px solid rgba(90,200,255,.25);
    border-radius:14px;overflow:hidden;
    transition:all .2s;cursor:pointer;
  }
  .map-card:hover{border-color:rgba(90,200,255,.7);transform:translateY(-3px);
    box-shadow:0 8px 30px rgba(0,120,200,.3);}
  .map-card.selected{border-color:#5ad8ff;box-shadow:0 0 26px rgba(90,200,255,.5);}
  .map-preview{
    height:140px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:52px;
  }
  .map-info{padding:14px 16px;}
  .map-info h3{font-size:17px;letter-spacing:2.5px;margin-bottom:6px;}
  .map-info p{font-size:12px;color:rgba(180,220,255,.6);margin-bottom:10px;letter-spacing:.5px;}
  .map-info button{
    width:100%;background:rgba(20,60,110,.8);border:1px solid rgba(90,200,255,.5);
    border-radius:7px;padding:8px;color:#fff;font-weight:700;font-size:12px;
    letter-spacing:1.5px;cursor:pointer;transition:all .15s;
  }
  .map-info button:hover{background:rgba(40,100,170,.95);border-color:#5ad8ff;}
  .map-info button.locked{color:#ffd76a;border-color:rgba(255,200,60,.5);}

  /* === Racing HUD === */
  #screen-racing{pointer-events:none;}
  #screen-racing .panel{
    position:absolute;background:rgba(8,16,28,.62);
    border:1px solid rgba(90,200,255,.35);border-radius:10px;
    padding:7px 14px;color:#cfe9ff;font-weight:700;font-size:15px;
    letter-spacing:1.5px;text-shadow:0 0 10px rgba(80,200,255,.75);
    backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(0,120,200,.25),inset 0 0 22px rgba(0,120,200,.12);
  }
  #screen-racing .panel span{color:#fff45a;text-shadow:0 0 12px rgba(255,220,60,.9);}
  #posPanel{top:18px;left:18px;}
  #lapPanel{top:18px;left:50%;transform:translateX(-50%);}
  #timePanel{top:18px;right:18px;font-variant-numeric:tabular-nums;}
  #speedo{
    position:absolute;right:22px;bottom:20px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 50% 55%,rgba(10,25,45,.85),rgba(4,8,16,.9));
    border:2px solid rgba(90,200,255,.4);
    box-shadow:0 0 30px rgba(0,140,255,.35),inset 0 0 40px rgba(0,120,220,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#dff3ff;
  }
  #speed{font-size:56px;font-weight:800;line-height:1;
    text-shadow:0 0 22px rgba(90,210,255,.9);font-variant-numeric:tabular-nums;}
  #speedo small{font-size:13px;letter-spacing:3px;opacity:.7;margin-top:4px;}
  #minimap{
    position:absolute;left:18px;bottom:18px;border-radius:12px;
    border:1px solid rgba(90,200,255,.35);
    box-shadow:0 0 20px rgba(0,120,200,.3);
    background:rgba(4,10,18,.55);
  }
  #centerMsg{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    font-size:96px;font-weight:900;letter-spacing:6px;color:#fff;
    text-shadow:0 0 30px rgba(90,210,255,.95),0 0 70px rgba(0,140,255,.6);
    opacity:0;transition:opacity .18s;text-align:center;pointer-events:none;
  }
  #centerMsg.small{font-size:44px;letter-spacing:3px;}
  #centerMsg.show{opacity:1;}
  #help{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    color:rgba(180,220,255,.55);font-size:13px;letter-spacing:1.6px;
    text-align:center;white-space:nowrap;
  }
  #help b{color:rgba(255,240,120,.9);}
  #pause-btn{
    position:absolute;top:18px;right:220px;
    width:44px;height:44px;border-radius:10px;
    background:rgba(8,22,40,.72);border:1px solid rgba(90,200,255,.4);
    color:#cfe9ff;font-size:20px;cursor:pointer;pointer-events:auto;
    transition:all .15s;
  }
  #pause-btn:hover{background:rgba(20,60,110,.85);border-color:#5ad8ff;color:#fff;}

  /* === Modals === */
  .modal{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(2,6,14,.82);
    backdrop-filter:blur(8px);
    z-index:100;
    flex-direction:column;gap:20px;
    pointer-events:auto;
  }
  .modal.active{display:flex;}
  .modal h2{
    font-size:44px;letter-spacing:8px;font-weight:900;color:#fff;
    text-shadow:0 0 30px rgba(90,200,255,.9),0 0 70px rgba(0,140,255,.5);
  }
  .modal .content{
    background:rgba(8,18,32,.9);
    border:1px solid rgba(90,200,255,.4);
    border-radius:14px;padding:26px 34px;min-width:320px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,120,200,.25);
  }
  .modal .content .row{
    display:flex;justify-content:space-between;gap:40px;
    padding:10px 0;font-size:18px;
  }
  .modal .content .row .label{color:rgba(180,220,255,.6);letter-spacing:2px;}
  .modal .content .row .value{font-weight:800;color:#fff;}
  .modal .content .row .value.gold{color:#ffd76a;text-shadow:0 0 12px rgba(255,200,60,.6);}
  .modal .buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .modal .buttons button{
    background:rgba(20,60,110,.85);border:1px solid rgba(90,200,255,.5);
    border-radius:9px;padding:12px 26px;color:#fff;font-weight:700;
    font-size:14px;letter-spacing:2px;cursor:pointer;transition:all .15s;
  }
  .modal .buttons button:hover{background:rgba(40,100,170,.95);border-color:#5ad8ff;
    box-shadow:0 0 20px rgba(90,200,255,.5);}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ============================== MAIN MENU ============================== -->
<div id="screen-menu" class="screen active">
  <div class="logo">NEON<span>APEX</span></div>
  <div class="subtitle">MOTO RACING</div>
  <div class="coins">💰 <span id="coins-menu">0</span></div>
  <div class="menu-nav">
    <button data-nav="race">🏁 &nbsp;ГОНКА</button>
    <button data-nav="garage">🔧 &nbsp;ГАРАЖ</button>
    <button data-nav="shop">🛒 &nbsp;МАГАЗИН</button>
    <button data-nav="leaderboard">🏆 &nbsp;РЕКОРДЫ</button>
    <button data-nav="maps">🗺️ &nbsp;КАРТЫ</button>
  </div>
</div>

<!-- ============================== GARAGE ============================== -->
<div id="screen-garage" class="screen">
  <div class="header">
    <button class="back-btn" data-nav="menu">← НАЗАД</button>
    <h2>ГАРАЖ</h2>
    <div class="coins">💰 <span id="coins-garage">0</span></div>
  </div>
  <div class="garage-panel">
    <h3>ЦВЕТ МОТОЦИКЛА</h3>
    <div class="swatches" id="bike-swatches"></div>
    <h3>КОСТЮМ ПИЛОТА</h3>
    <div class="swatches" id="suit-swatches"></div>
    <h3>ШЛЕМ</h3>
    <div class="swatches" id="helmet-swatches"></div>
  </div>
  <div class="hint">Перетащи мышью, чтобы вращать</div>
</div>

<!-- ============================== SHOP ============================== -->
<div id="screen-shop" class="screen">
  <div class="header">
    <button class="back-btn" data-nav="menu">← НАЗАД</button>
    <h2>МАГАЗИН</h2>
    <div class="coins">💰 <span id="coins-shop">0</span></div>
  </div>
  <div class="shop-tabs">
    <button data-tab="bike" class="active">МОТОЦИКЛ</button>
    <button data-tab="suit">КОСТЮМ</button>
    <button data-tab="helmet">ШЛЕМ</button>
  </div>
  <div class="shop-grid" id="shop-grid"></div>
</div>

<!-- ============================== LEADERBOARD ============================== -->
<div id="screen-leaderboard" class="screen">
  <div class="header">
    <button class="back-btn" data-nav="menu">← НАЗАД</button>
    <h2>ТАБЛИЦА РЕКОРДОВ</h2>
  </div>
  <div class="leaderboard" id="leaderboard-content"></div>
</div>

<!-- ============================== MAPS ============================== -->
<div id="screen-maps" class="screen">
  <div class="header">
    <button class="back-btn" data-nav="menu">← НАЗАД</button>
    <h2>ВЫБОР КАРТЫ</h2>
    <div class="coins">💰 <span id="coins-maps">0</span></div>
  </div>
  <div class="maps-grid" id="maps-grid"></div>
</div>

<!-- ============================== RACING ============================== -->
<div id="screen-racing" class="screen">
  <div class="panel" id="posPanel">POS <span id="pos">1</span>/4</div>
  <div class="panel" id="lapPanel">LAP <span id="lap">1</span>/3</div>
  <div class="panel" id="timePanel"><span id="time">0:00.00</span></div>
  <div id="speedo"><div id="speed">0</div><small>KM/H</small></div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="centerMsg"></div>
  <div id="help"><b>W / ↑</b> газ &nbsp;·&nbsp; <b>S / ↓</b> тормоз &nbsp;·&nbsp; <b>A D / ← →</b> руль &nbsp;·&nbsp; <b>SPACE</b> ручник &nbsp;·&nbsp; <b>R</b> заново &nbsp;·&nbsp; <b>ESC</b> пауза</div>
  <button id="pause-btn">⏸</button>
</div>

<!-- ============================== RESULT MODAL ============================== -->
<div id="results-modal" class="modal">
  <h2>ФИНИШ</h2>
  <div class="content" id="results-content"></div>
  <div class="buttons">
    <button data-nav="race-again">ЕЩЁ РАЗ</button>
    <button data-nav="garage">В ГАРАЖ</button>
    <button data-nav="menu">В МЕНЮ</button>
  </div>
</div>

<!-- ============================== PAUSE MODAL ============================== -->
<div id="pause-modal" class="modal">
  <h2>ПАУЗА</h2>
  <div class="buttons">
    <button data-nav="resume">ПРОДОЛЖИТЬ</button>
    <button data-nav="restart">ЗАНОВО</button>
    <button data-nav="menu">В МЕНЮ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   NEON APEX — single file 3D motorcycle racing game
   ========================================================================= */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const $     = id => document.getElementById(id);

/* ============================ SAVE SYSTEM ============================ */
const SAVE_KEY = 'neonApexSave_v2';
const DEFAULT_SAVE = {
  coins: 250,
  ownedBikeColors:   [0x2ec8ff, 0xff3b3b],
  ownedSuitColors:   [0x1d2a3d, 0x8b1a1a],
  ownedHelmetColors: [0xf2f4f8, 0x1a1a1a],
  ownedMaps: ['tienShan'],
  bikeColor:   0x2ec8ff,
  suitColor:   0x1d2a3d,
  helmetColor: 0xf2f4f8,
  selectedMap: 'tienShan',
  bestTimes: {}
};
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), s);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
}
function persistSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); }catch(e){} }
const Save = loadSave();

/* ============================ COLORS / ITEMS ============================ */
const BIKE_COLORS = [
  { c:0x2ec8ff, n:'Ледяной',   cost:0   },
  { c:0xff3b3b, n:'Огонь',     cost:0   },
  { c:0xffa824, n:'Оранж',     cost:100 },
  { c:0x9cff3b, n:'Лайм',      cost:100 },
  { c:0xb45cff, n:'Фиолет',    cost:150 },
  { c:0xff2ec8, n:'Розовый',   cost:150 },
  { c:0xffd23b, n:'Золото',    cost:250 },
  { c:0xe0e0ff, n:'Хром',      cost:300 },
  { c:0x1a1a22, n:'Тёмный',    cost:80  },
  { c:0xffffff, n:'Белый',     cost:120 }

/* ============================ TEXTURE FACTORY ============================ */
function makeCanvas(size){ const c = document.createElement('canvas'); c.width = c.height = size; return c; }
function texFrom(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx||1, ry||1);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.encoding = THREE.sRGBEncoding;
  return t;
}

function makeAsphaltTexture(){
  const S = 512, c = makeCanvas(S), x = c.getContext('2d');
  x.fillStyle = '#43454c'; x.fillRect(0,0,S,S);
  const img = x.getImageData(0,0,S,S), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*46;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  x.putImageData(img,0,0);
  for(let i=0;i<2600;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(190,190,195,0.10)' : 'rgba(10,10,14,0.14)';
    x.fillRect(Math.random()*S, Math.random()*S, 1.6, 1.6);
  }
  x.fillStyle = 'rgba(20,20,24,0.13)';
  x.fillRect(120,0,60,S); x.fillRect(332,0,60,S);
  x.fillStyle = 'rgba(236,238,232,0.92)';
  x.fillRect(14,0,11,S); x.fillRect(S-25,0,11,S);
  x.fillStyle = 'rgba(244,232,150,0.92)';
  x.fillRect(S/2-6, 0, 12, S*0.55);
  return c;
}
function makeKerbTexture(){
  const c = makeCanvas(64), x = c.getContext('2d');
  x.fillStyle = '#e6e6e6'; x.fillRect(0,0,64,64);
  x.fillStyle = '#cf2b2b'; x.fillRect(0,0,64,32);
  return c;
}
function makeGrassTexture(){
  const S = 256, c = makeCanvas(S), x = c.getContext('2d');
  x.fillStyle = '#3f6b34'; x.fillRect(0,0,S,S);
  for(let i=0;i<9000;i++){
    const g = 40 + Math.random()*80;
    x.fillStyle = `rgba(${g*0.55|0},${g+45|0},${g*0.5|0},0.5)`;
    x.fillRect(Math.random()*S, Math.random()*S, 2, 2);
  }
  for(let i=0;i<40;i++){
    x.fillStyle = 'rgba(30,55,26,0.25)';
    x.beginPath(); x.arc(Math.random()*S, Math.random()*S, 8+Math.random()*26, 0, Math.PI*2); x.fill();
  }
  return c;
}
function makeSandTexture(){
  const S = 256, c = makeCanvas(S), x = c.getContext('2d');
  x.fillStyle = '#c9a86a'; x.fillRect(0,0,S,S);
  for(let i=0;i<7000;i++){
    const g = 140 + Math.random()*70;
    x.fillStyle = `rgba(${g+30|0},${g|0},${g-40|0},0.4)`;
    x.fillRect(Math.random()*S, Math.random()*S, 2.2, 2.2);
  }
  for(let i=0;i<25;i++){
    x.fillStyle = 'rgba(180,150,100,0.25)';
    x.beginPath(); x.arc(Math.random()*S, Math.random()*S, 6+Math.random()*20, 0, Math.PI*2); x.fill();
  }
  return c;
}
function makeDarkTexture(){
  const S = 256, c = makeCanvas(S), x = c.getContext('2d');
  x.fillStyle = '#1a1a22'; x.fillRect(0,0,S,S);
  for(let i=0;i<4000;i++){
    const g = 10 + Math.random()*40;
    x.fillStyle = `rgba(${g|0},${g|0},${g+10|0},0.4)`;
    x.fillRect(Math.random()*S, Math.random()*S, 2, 2);
  }
  return c;
}
function makeOilTexture(){
  const c = makeCanvas(128), x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0,'rgba(8,8,14,0.96)');
  g.addColorStop(0.55,'rgba(14,14,26,0.88)');
  g.addColorStop(0.85,'rgba(22,20,44,0.45)');
  g.addColorStop(1,'rgba(30,30,60,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  for(let i=0;i<5;i++){
    x.strokeStyle = `hsla(${Math.random()*360},80%,60%,0.16)`;
    x.lineWidth = 4;
    x.beginPath(); x.arc(64,64, 18+i*9, Math.random()*6.28, Math.random()*6.28+2); x.stroke();
  }
  return c;
}

/* ============================ SKY BUILDER ============================ */
function makeSkyTexture(colors){
  const c = document.createElement('canvas'); c.width = 16; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0, colors.top);
  g.addColorStop(0.45, colors.mid);
  g.addColorStop(1, colors.bottom);
  x.fillStyle = g; x.fillRect(0,0,16,256);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ============================ TRACK BUILDER ============================ */
const N_SAMPLES = 900;
let samples = [];
let TRACK_LEN = 0, SEG_LEN = 0;
let trackCurve = null;

function buildTrack(controlPointsArr){
  const pts = controlPointsArr.map(p => new THREE.Vector3(p[0], 0, p[1]));
  trackCurve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  TRACK_LEN = trackCurve.getLength();
  SEG_LEN = TRACK_LEN / N_SAMPLES;
  const raw = trackCurve.getSpacedPoints(N_SAMPLES);
  samples = [];
  for(let i=0;i<N_SAMPLES;i++){
    const p = raw[i].clone();
    const t = new THREE.Vector3().subVectors(raw[i+1], raw[i]).normalize();
    const n = new THREE.Vector3(t.z, 0, -t.x).normalize();
    samples.push({ p, t, n });
  }
}

function buildRibbon(offA, offB, y, vScale){
  const N = samples.length;
  const pos = new Float32Array((N+1)*2*3);
  const uv  = new Float32Array((N+1)*2*2);
  const idx = [];
  let vi = 0, ui = 0;
  for(let i=0;i<=N;i++){
    const s = samples[i % N];
    pos[vi++] = s.p.x + s.n.x*offA; pos[vi++] = y; pos[vi++] = s.p.z + s.n.z*offA;
    pos[vi++] = s.p.x + s.n.x*offB; pos[vi++] = y; pos[vi++] = s.p.z + s.n.z*offB;
    const v = (i*SEG_LEN)/vScale;
    uv[ui++] = 0; uv[ui++] = v;
    uv[ui++] = 1; uv[ui++] = v;
  }
  for(let i=0;i<N;i++){
    const a=i*2, b=i*2+1, c=(i+1)*2, d=(i+1)*2+1;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

  );

  ground.position.y = -0.06;

    trunks.castShadow = foliage.castShadow = true;

    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc3 = new THREE.Vector3();
    let placed = 0, guard = 0;
    while(placed < COUNT && guard < COUNT*40){
      guard++;

/* ---- obstacles ---- */
function buildObstacles(scene, map){
  // moving barriers
  const COUNT = 13;
  const barMat = new THREE.MeshStandardMaterial({
    color:0xff5222, emissive:0x6b1600, emissiveIntensity:0.7,
    metalness:0.45, roughness:0.45
  });
  const stripeMat = new THREE.MeshStandardMaterial({
    color:0xf5f5f5, emissive:0x333333, emissiveIntensity:0.3,
    metalness:0.3, roughness:0.6
  });
  const postMat = new THREE.MeshStandardMaterial({color:0x22262e, metalness:0.7, roughness:0.4});

  for(let i=0;i<COUNT;i++){
    const idx = Math.floor(45 + ((i+0.5)/COUNT) * (N_SAMPLES-90) + rnd(-14,14));
    const s = samples[((idx % N_SAMPLES) + N_SAMPLES) % N_SAMPLES];
    const g = new THREE.Group();
    const bar = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.15, 0.55), barMat);
    bar.position.y = 0.95; bar.castShadow = true; g.add(bar);
    for(let k=-1;k<=1;k+=2){
      const st = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.62), stripeMat);
      st.position.set(k*1.9, 0.95, 0); st.castShadow = true; g.add(st);
    }
    for(const px of [-2.9, 2.9]){
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,1.5,8), postMat);
      p.position.set(px, 0.75, 0); p.castShadow = true; g.add(p);
    }
    g.position.set(s.p.x, 0, s.p.z);
    g.rotation.y = Math.atan2(s.t.x, s.t.z);
    scene.add(g);
    obstacles.push({
      type:'barrier', mesh:g,
      base: s.p.clone(), normal: s.n.clone(),
      offset:0, phase: Math.random()*Math.PI*2,
      speed: rnd(0.65, 1.5),
      range: ROAD_HALF - 4.6,
      pos: new THREE.Vector3(s.p.x, 0, s.p.z),
      radius: 3.35, collidable:true
    });
  }

  // oil slicks
  const OIL_COUNT = 20;
  for(let i=0;i<OIL_COUNT;i++){
    const idx = Math.floor(40 + ((i+0.5)/OIL_COUNT) * (N_SAMPLES-80) + rnd(-10,10));
    const s = samples[((idx % N_SAMPLES) + N_SAMPLES) % N_SAMPLES];
    const off = rnd(-(ROAD_HALF-4), ROAD_HALF-4);
    const r = rnd(2.4, 4.4);
    const m = new THREE.Mesh(
      new THREE.CircleGeometry(r, 22),
      new THREE.MeshBasicMaterial({ map:TEX.oil, transparent:true, opacity:0.92, depthWrite:false })
    );
    m.rotation.x = -Math.PI/2;
    m.position.set(s.p.x + s.n.x*off, 0.035, s.p.z + s.n.z*off);
    m.renderOrder = 3;
    scene.add(m);
    obstacles.push({ type:'oil', mesh:m, pos: m.position.clone(), radius: r*0.92, collidable:false });
  }

  // cones
  const CONE_COUNT = 46;
  const coneMat = new THREE.MeshStandardMaterial({color:0xff7a18, emissive:0x882f00, emissiveIntensity:0.35, roughness:0.6, metalness:0.1});
  const baseMat = new THREE.MeshStandardMaterial({color:0x1a1a1f, roughness:0.9});
  const coneGeo = new THREE.ConeGeometry(0.42, 1.15, 10);
  const baseGeo = new THREE.BoxGeometry(0.85, 0.09, 0.85);
  for(let i=0;i<CONE_COUNT;i++){
    const idx = Math.floor(50 + ((i+0.5)/CONE_COUNT) * (N_SAMPLES-100) + rnd(-9,9));
    const s = samples[((idx % N_SAMPLES) + N_SAMPLES) % N_SAMPLES];
    const off = rnd(-(ROAD_HALF-1.5), ROAD_HALF-1.5);
    const g = new THREE.Group();
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.y = 0.62; cone.castShadow = true;
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 0.05;
    g.add(cone, base);
    g.position.set(s.p.x + s.n.x*off, 0, s.p.z + s.n.z*off);
    scene.add(g);
    obstacles.push({ type:'cone', mesh:g, pos: g.position.clone(), radius: 0.62, collidable:true });
  }
}

/* ============================ INPUT ============================ */
const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'KeyR' && activeScreen === 'racing'){ startRace(currentMapKey); }
  if(e.code === 'Escape' && activeScreen === 'racing'){
    if($('pause-modal').classList.contains('active')){
      $('pause-modal').classList.remove('active');
    } else {
      $('pause-modal').classList.add('active');
    }
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

function readPlayerInput(b){
  const up    = keys['KeyW'] || keys['ArrowUp'];
  const down  = keys['KeyS'] || keys['ArrowDown'];
  const left  = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];
  b.throttle    = up ? 1 : 0;
  b.brake       = down ? 1 : 0;
  b.steerTarget = (right ? 1 : 0) - (left ? 1 : 0);
  b.handbrake   = keys['Space'] ? 1 : 0;
}

/* ============================ AI ============================ */
function updateAI(b, dt){
  const idx = b.trackIndex;
  const look = 12 + Math.floor(Math.min(b.speed, 62) * 0.55);
  const s = samples[(idx + look) % N_SAMPLES];
  const lane = clamp(b.laneOffset + Math.sin(gameTime*0.55 + b.aiPhase) * 2.2, -(ROAD_HALF-3), ROAD_HALF-3);
  const tx = s.p.x + s.n.x*lane;
  const tz = s.p.z + s.n.z*lane;
  const desired = Math.atan2(tx - b.pos.x, tz - b.pos.z);
  let diff = desired - b.heading;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  b.steerTarget = clamp(-diff * 2.3, -1, 1);
  const absDiff = Math.abs(diff);
  b.throttle = clamp((1.2 - absDiff*1.55) * b.skill, 0.2, 1);
  b.brake    = (absDiff > 0.5 && b.speed > 26) ? 0.8 : 0;
  b.handbrake= 0;
}

/* ============================ PHYSICS ============================ */
const tmpFwd = new THREE.Vector3();
const tmpRgt = new THREE.Vector3();

function findNearestIndex(pos, hint){
  let best = hint, bestD = Infinity;
  const start = hint - 70, end = hint + 70;
  for(let k=start;k<=end;k++){
    const i = ((k % N_SAMPLES) + N_SAMPLES) % N_SAMPLES;
    const s = samples[i];
    const dx = pos.x - s.p.x, dz = pos.z - s.p.z;
    const d = dx*dx + dz*dz;
    if(d < bestD){ bestD = d; best = i; }
  }
  return best;
}

function updateSurface(b){
  const s = samples[b.trackIndex];
  const dx = b.pos.x - s.p.x, dz = b.pos.z - s.p.z;
  const lat = dx*s.n.x + dz*s.n.z;
  const aLat = Math.abs(lat);
  let surf = 'road';
  if(aLat > ROAD_HALF + 1.8) surf = 'grass';
  else if(aLat > ROAD_HALF)  surf = 'kerb';
  b.onOil = false;
  if(surf !== 'grass'){
    for(const o of obstacles){
      if(o.type !== 'oil') continue;
      const ox = b.pos.x - o.pos.x, oz = b.pos.z - o.pos.z;
      if(ox*ox + oz*oz < o.radius*o.radius){ b.onOil = true; break; }
    }
  }
  b.surface = surf;
}

function updateBikePhysics(b, dt){
  b.steer += (b.steerTarget - b.steer) * Math.min(1, 10*dt);
  tmpFwd.set(Math.sin(b.heading), 0, Math.cos(b.heading));
  tmpRgt.set(-Math.cos(b.heading), 0, Math.sin(b.heading));
  let vLong = b.vel.dot(tmpFwd);
  let vLat  = b.vel.dot(tmpRgt);
  const surf = SURFACES[b.surface];

  if(b.throttle > 0){
    const maxS = MAX_SPEED * surf.maxSpeed;
    const ratio = clamp(vLong / Math.max(maxS, 1), 0, 1);
    vLong += ACCEL * b.throttle * (1 - ratio*0.82) * dt;
  }
  if(b.brake > 0){
    vLong -= BRAKE_F * b.brake * dt;
    if(vLong < 0) vLong = 0;
  }
  vLong -= DRAG * vLong * Math.abs(vLong) * dt;
  vLong -= (ROLL + surf.roll) * vLong * dt;
  if(vLong > MAX_SPEED * surf.maxSpeed * 1.02){
    vLong = MAX_SPEED * surf.maxSpeed * 1.02;
  }

  let grip = surf.grip;
  if(b.onOil) grip = 1.4;
  if(b.handbrake) grip *= 0.22;
  vLat *= Math.exp(-grip * dt);
  vLat = clamp(vLat, -32, 32);

  b.vel.copy(tmpFwd).multiplyScalar(vLong).addScaledVector(tmpRgt, vLat);

  const spd = Math.abs(vLong);
  const authority = clamp(spd/8, 0, 1) * (1 - 0.5*clamp(spd/MAX_SPEED, 0, 1));
  const yawRate = -b.steer * STEER_RATE * authority;
  b.heading += yawRate * dt;
  b.yawRate = yawRate;

  b.pos.addScaledVector(b.vel, dt);

  b.speed = vLong;
  b.wheelSpin += (vLong / WHEEL_R) * dt;

  const leanTarget = clamp(-yawRate * spd * 0.016, -0.78, 0.78);
  b.lean += (leanTarget - b.lean) * Math.min(1, 9*dt);
}

function handleObstacleCollisions(b){
  for(const o of obstacles){
    if(!o.collidable) continue;
    const dx = b.pos.x - o.pos.x;
    const dz = b.pos.z - o.pos.z;
    const rr = o.radius + BIKE_RADIUS;
    const d2 = dx*dx + dz*dz;
    if(d2 > rr*rr || d2 < 1e-6) continue;
    const d = Math.sqrt(d2);
    const nx = dx/d, nz = dz/d;
    const push = (rr - d);
    b.pos.x += nx * push;
    b.pos.z += nz * push;
    const vn = b.vel.x*nx + b.vel.z*nz;
    if(vn < 0){
      b.vel.x -= 1.55*vn*nx;
      b.vel.z -= 1.55*vn*nz;
    }
    b.vel.multiplyScalar(0.5);
  }
}

function updateLapProgress(b){
  const prev = b.lastIndex;
  const cur  = findNearestIndex(b.pos, b.lastIndex);

  if(prev > N_SAMPLES*0.75 && cur < N_SAMPLES*0.25){
    b.lap++;
    if(b.lap >= TOTAL_LAPS && !b.finished){
      b.finished = true;
      b.finishTime = raceTime;
      if(b.isPlayer) onPlayerFinish();
    }
  } else if(prev < N_SAMPLES*0.25 && cur > N_SAMPLES*0.75){
    if(b.lap > 0) b.lap--;
  }

  b.lastIndex = cur;
  b.trackIndex = cur;
  b.progress = b.lap * N_SAMPLES + cur;

  const s = samples[cur];
  const dx = b.pos.x - s.p.x, dz = b.pos.z - s.p.z;
  if(dx*dx + dz*dz > 90*90){
    b.pos.set(s.p.x, 0, s.p.z);
    b.vel.set(0,0,0);
  }
}

function updateObstacles(dt){
  for(const o of obstacles){
    if(o.type !== 'barrier') continue;
    o.offset = Math.sin(gameTime*o.speed + o.phase) * o.range;
    const x = o.base.x + o.normal.x*o.offset;
    const z = o.base.z + o.normal.z*o.offset;
    o.mesh.position.x = x;
    o.mesh.position.z = z;
    o.pos.set(x, 0, z);
  }
}

const TOTAL_LAPS = 3;
const FIXED_DT = 1/120;
let accumulator = 0;

function stepPhysics(dt){
  gameTime += dt;

  if(state === 'countdown'){
    countdown -= dt;
    for(const b of bikes){ b.throttle = 0; b.brake = 0; b.steerTarget = 0; b.handbrake = 0; }
    if(countdown <= 0){ state = 'racing'; }
  } else if(state === 'racing'){
    raceTime += dt;
    for(const b of bikes){
      if(b.isPlayer) readPlayerInput(b);
      else           updateAI(b, dt);
    }
  }

  updateObstacles(dt);
  for(const b of bikes){
    updateBikePhysics(b, dt);
    updateSurface(b);
    handleObstacleCollisions(b);
    updateLapProgress(b);
  }
}

function syncBikeMesh(b){
  b.mesh.position.set(b.pos.x, 0, b.pos.z);
  b.mesh.rotation.set(0, b.heading, b.lean);
  const fw = b.mesh.userData.frontWheel;
  const rw = b.mesh.userData.rearWheel;
  if(fw) fw.rotation.x = b.wheelSpin;
  if(rw) rw.rotation.x = b.wheelSpin;
}

/* ============================ RACE FINISH ============================ */
function onPlayerFinish(){
  state = 'finished';
  // sort by progress
  const sorted = [...bikes].sort((a,b) => {
    if(a.finished && b.finished) return a.finishTime - b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.progress - a.progress;
  });
  finishPlace = sorted.indexOf(player) + 1;

  // award coins
  const reward = [250, 150, 80, 40][finishPlace-1] || 20;
  raceCoinsEarned = reward;
  Save.coins += reward;

  // save best time
  const mapKey = currentMapKey;
  if(!Save.bestTimes[mapKey] || player.finishTime < Save.bestTimes[mapKey].time){
    Save.bestTimes[mapKey] = {
      time: player.finishTime,
      place: finishPlace,
      date: Date.now()
    };
  }
  persistSave();
  updateCoinDisplays();

  // show result modal
  const content = $('results-content');
  content.innerHTML = `
    <div class="row"><span class="label">МЕСТО</span><span class="value">${finishPlace} / 4</span></div>
    <div class="row"><span class="label">ВРЕМЯ</span><span class="value">${fmtTime(player.finishTime)}</span></div>
    <div class="row"><span class="label">НАГРАДА</span><span class="value gold">+💰 ${reward}</span></div>
  `;
  $('results-modal').classList.add('active');
}

/* ============================ CAMERA (RACE) ============================ */
const camLook = new THREE.Vector3();
const camDesired = new THREE.Vector3();
const camFwd = new THREE.Vector3();

function updateRaceCamera(dt){
  const p = player;
  camFwd.set(Math.sin(p.heading), 0, Math.cos(p.heading));
  const back = 9.6, height = 4.2;
  camDesired.set(p.pos.x - camFwd.x*back, height, p.pos.z - camFwd.z*back);
  const k = 1 - Math.exp(-7.5*dt);
  raceCamera.position.lerp(camDesired, k);
  const lookTarget = new THREE.Vector3(p.pos.x + camFwd.x*9, 1.5, p.pos.z + camFwd.z*9);
  camLook.lerp(lookTarget, 1 - Math.exp(-9*dt));
  raceCamera.lookAt(camLook);
  const targetFov = 62 + Math.min(Math.abs(p.speed), 68) * 0.24;
  raceCamera.fov += (targetFov - raceCamera.fov) * Math.min(1, 4*dt);
  raceCamera.updateProjectionMatrix();

  const sun = raceScene.userData.sun;
  if(sun){
    sun.position.set(p.pos.x + 140, 220, p.pos.z + 90);
    sun.target.position.set(p.pos.x, 0, p.pos.z);
    sun.target.updateMatrixWorld();
  }
}

function initCamera(){
  camFwd.set(Math.sin(player.heading), 0, Math.cos(player.heading));
  raceCamera.position.set(player.pos.x - camFwd.x*9.6, 4.2, player.pos.z - camFwd.z*9.6);
  camLook.set(player.pos.x + camFwd.x*9, 1.5, player.pos.z + camFwd.z*9);
  raceCamera.lookAt(camLook);
}

/* ============================ HUD ============================ */
const elPos = $('pos'), elLap = $('lap'), elTime = $('time'),
      elSpeed = $('speed'), elCenter = $('centerMsg'),
      mini = $('minimap'), mctx = mini.getContext('2d');

let mmMinX, mmMaxX, mmMinZ, mmMaxZ, mmScale, mmOffX, mmOffY;
function recomputeMinimapBounds(){
  mmMinX = 1e9; mmMaxX = -1e9; mmMinZ = 1e9; mmMaxZ = -1e9;
  for(const s of samples){
    if(s.p.x < mmMinX) mmMinX = s.p.x;
    if(s.p.x > mmMaxX) mmMaxX = s.p.x;
    if(s.p.z < mmMinZ) mmMinZ = s.p.z;
    if(s.p.z > mmMaxZ) mmMaxZ = s.p.z;
  }
  const mmPad = 16;
  mmScale = Math.min(
    (mini.width  - mmPad*2) / (mmMaxX - mmMinX),
    (mini.height - mmPad*2) / (mmMaxZ - mmMinZ)
  );
  mmOffX = mmPad + ((mini.width  - mmPad*2) - (mmMaxX-mmMinX)*mmScale)/2;
  mmOffY = mmPad + ((mini.height - mmPad*2) - (mmMaxZ-mmMinZ)*mmScale)/2;
}
const mmX = x => mmOffX + (x - mmMinX)*mmScale;
const mmY = z => mmOffY + (z - mmMinZ)*mmScale;

let miniTimer = 0;
function drawMinimap(){
  mctx.clearRect(0,0,mini.width,mini.height);
  mctx.beginPath();
  for(let i=0;i<=N_SAMPLES;i+=4){
    const s = samples[i % N_SAMPLES];
    const X = mmX(s.p.x), Y = mmY(s.p.z);
    if(i===0) mctx.moveTo(X,Y); else mctx.lineTo(X,Y);
  }
  mctx.closePath();
  mctx.strokeStyle = 'rgba(70,170,255,0.35)';
  mctx.lineWidth = 9; mctx.stroke();
  mctx.strokeStyle = 'rgba(190,235,255,0.85)';
  mctx.lineWidth = 1.6; mctx.stroke();

  const s0 = samples[0];
  mctx.beginPath();
  mctx.moveTo(mmX(s0.p.x + s0.n.x*ROAD_HALF), mmY(s0.p.z + s0.n.z*ROAD_HALF));
  mctx.lineTo(mmX(s0.p.x - s0.n.x*ROAD_HALF), mmY(s0.p.z - s0.n.z*ROAD_HALF));
  mctx.strokeStyle = 'rgba(255,240,90,0.95)';
  mctx.lineWidth = 2.5; mctx.stroke();

  for(const b of bikes){
    const X = mmX(b.pos.x), Y = mmY(b.pos.z);
    mctx.beginPath();
    mctx.arc(X, Y, b.isPlayer ? 5.5 : 4, 0, Math.PI*2);
    mctx.fillStyle = b.isPlayer ? '#fff45a' : b.colorCss;
    mctx.fill();
    if(b.isPlayer){
      mctx.strokeStyle = '#ffffff';
      mctx.lineWidth = 1.5;
      mctx.stroke();
    }
  }
}

function fmtTime(t){
  const m = Math.floor(t/60);
  const s = t - m*60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
}

let lastCenterText = '';
function setCenter(text, small){
  if(text === lastCenterText) return;
  lastCenterText = text;
  if(!text){ elCenter.classList.remove('show'); return; }
  elCenter.textContent = text;
  elCenter.classList.toggle('small', !!small);
  elCenter.classList.add('show');
}

function updateHUD(dt){
  if(!player) return;
  const sorted = [...bikes].sort((a,b) => {
    if(a.finished && b.finished) return a.finishTime - b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.progress - a.progress;
  });
  elPos.textContent = sorted.indexOf(player) + 1;
  elLap.textContent = Math.min(player.lap + 1, TOTAL_LAPS);
  const shownTime = player.finished ? player.finishTime : raceTime;
  elTime.textContent = fmtTime(shownTime);
  elSpeed.textContent = Math.round(Math.abs(player.speed) * 3.6);

  if(state === 'countdown'){
    const n = Math.ceil(countdown - 1);
    if(countdown > 1) setCenter(String(Math.max(n,1)));
    else              setCenter('GO!');
  } else if(state === 'racing'){
    if(raceTime < 1.2) setCenter('GO!');
    else setCenter('');
  } else if(state === 'finished'){
    setCenter(`FINISH — P${finishPlace}`, true);
  }

  miniTimer += dt;
  if(miniTimer > 0.05){
    miniTimer = 0;
    drawMinimap();
  }
}

/* ============================ SCREEN MANAGER ============================ */
let activeScreen = 'menu';
let currentScene = null, currentCamera = null;

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = $('screen-' + name);
  if(el) el.classList.add('active');
  activeScreen = name;
}

function goMenu(){
  if(!menuScene) buildMenuScene();
  else {
    // refresh bike colors
    menuScene.remove(menuBike);
    menuBike = createBikeModel({
      bike: Save.bikeColor, suit: Save.suitColor, helmet: Save.helmetColor
    });
    menuBike.position.y = 0;
    menuScene.add(menuBike);
  }
  currentScene = menuScene;
  currentCamera = menuCamera;
  $('pause-modal').classList.remove('active');
  $('results-modal').classList.remove('active');
  showScreen('menu');
  updateCoinDisplays();
}

function goGarage(){
  if(garageScene){
    garageScene.remove(garageBike);
  }
  buildGarageScene();
  currentScene = garageScene;
  currentCamera = garageCamera;
  showScreen('garage');
  renderGarageSwatches();
  updateCoinDisplays();
}

function goShop(){
  goMenu(); // keep menu scene behind
  showScreen('shop');
  renderShop('bike');
  updateCoinDisplays();
}

function goLeaderboard(){
  goMenu();
  showScreen('leaderboard');
  renderLeaderboard();
}

function goMaps(){
  goMenu();
  showScreen('maps');
  renderMaps();
  updateCoinDisplays();
}

function startRace(mapKey){
  if(!Save.ownedMaps.includes(mapKey)){
    return; // shouldn't happen
  }
  Save.selectedMap = mapKey;
  persistSave();
  $('results-modal').classList.remove('active');
  $('pause-modal').classList.remove('active');
  buildRaceScene(mapKey);
  recomputeMinimapBounds();
  currentScene = raceScene;
  currentCamera = raceCamera;
  showScreen('racing');
}

/* ============================ GARAGE UI ============================ */
function renderGarageSwatches(){
  const makeSwatch = (color, selected, onClick) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (selected ? ' selected' : '');
    d.style.background = '#' + color.toString(16).padStart(6,'0');
    d.onclick = onClick;
    return d;
  };

  // bike
  const bs = $('bike-swatches'); bs.innerHTML = '';
  for(const c of BIKE_COLORS){
    if(!Save.ownedBikeColors.includes(c.c)) continue;
    bs.appendChild(makeSwatch(c.c, Save.bikeColor === c.c, () => {
      Save.bikeColor = c.c; persistSave(); goGarage();
    }));
  }
  // suit
  const ss = $('suit-swatches'); ss.innerHTML = '';
  for(const c of SUIT_COLORS){
    if(!Save.ownedSuitColors.includes(c.c)) continue;
    ss.appendChild(makeSwatch(c.c, Save.suitColor === c.c, () => {
      Save.suitColor = c.c; persistSave(); goGarage();
    }));
  }
  // helmet
  const hs = $('helmet-swatches'); hs.innerHTML = '';
  for(const c of HELMET_COLORS){
    if(!Save.ownedHelmetColors.includes(c.c)) continue;
    hs.appendChild(makeSwatch(c.c, Save.helmetColor === c.c, () => {
      Save.helmetColor = c.c; persistSave(); goGarage();
    }));
  }
}

/* ============================ SHOP UI ============================ */
let shopTab = 'bike';
function renderShop(tab){
  shopTab = tab;
  document.querySelectorAll('.shop-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  const grid = $('shop-grid');
  grid.innerHTML = '';

  let list, owned, onBuy;
  if(tab === 'bike'){
    list = BIKE_COLORS; owned = Save.ownedBikeColors;
    onBuy = (c) => { Save.ownedBikeColors.push(c.c); Save.bikeColor = c.c; };
  } else if(tab === 'suit'){
    list = SUIT_COLORS; owned = Save.ownedSuitColors;
    onBuy = (c) => { Save.ownedSuitColors.push(c.c); Save.suitColor = c.c; };
  } else {
    list = HELMET_COLORS; owned = Save.ownedHelmetColors;
    onBuy = (c) => { Save.ownedHelmetColors.push(c.c); Save.helmetColor = c.c; };
  }

  for(const c of list){
    const has = owned.includes(c.c);
    const card = document.createElement('div');
    card.className = 'shop-item';
    card.innerHTML = `
      <div class="swatch" style="background:#${c.c.toString(16).padStart(6,'0')}"></div>
      <div class="item-name">${c.n}</div>
      <div class="item-price ${has ? 'owned' : ''}">${has ? '✓ В ГАРАЖЕ' : '💰 ' + c.cost}</div>
    `;
    if(!has){
      const btn = document.createElement('button');
      btn.textContent = 'КУПИТЬ';
      if(Save.coins < c.cost){ btn.disabled = true; btn.textContent = 'НЕ ХВАТАЕТ 💰'; }
      btn.onclick = () => {
        if(Save.coins >= c.cost){
          Save.coins -= c.cost;
          onBuy(c);
          persistSave();
          updateCoinDisplays();
          renderShop(tab);
        }
      };
      card.appendChild(btn);
    }
    grid.appendChild(card);
  }
}

/* ============================ LEADERBOARD UI ============================ */
function renderLeaderboard(){
  const el = $('leaderboard-content');
  el.innerHTML = '';
  let any = false;
  for(const key of MAP_KEYS){
    const map = MAPS[key];
    const rec = Save.bestTimes[key];
    const block = document.createElement('div');
    block.className = 'lb-map';
    let rows = '';
    if(rec){
      any = true;
      rows = `
        <div class="lb-row">
          <span class="place">1</span>
          <span class="name">${map.name} — YOU</span>
          <span class="time">${fmtTime(rec.time)}</span>
        </div>
      `;
    } else {
      rows = '<div class="lb-empty">Нет рекордов — участвуй в гонке!</div>';
    }
    block.innerHTML = `<h3>${map.icon} ${map.name}</h3>${rows}`;
    el.appendChild(block);
  }
}

/* ============================ MAPS UI ============================ */
function renderMaps(){
  const grid = $('maps-grid');
  grid.innerHTML = '';
  for(const key of MAP_KEYS){
    const map = MAPS[key];
    const owned = Save.ownedMaps.includes(key);
    const selected = Save.selectedMap === key;
    const card = document.createElement('div');
    card.className = 'map-card' + (selected ? ' selected' : '');
    card.innerHTML = `
      <div class="map-preview" style="background:linear-gradient(135deg, ${map.sky.mid}, ${map.sky.bottom});">${map.icon}</div>
      <div class="map-info">
        <h3>${map.name}</h3>
        <p>${map.desc}</p>
        <button class="${owned ? '' : 'locked'}">${owned ? (selected ? '✓ ВЫБРАНА' : 'ВЫБРАТЬ') : '💰 ' + map.cost}</button>
      </div>
    `;
    const btn = card.querySelector('button');
    btn.onclick = (e) => {
      e.stopPropagation();
      if(owned){
        Save.selectedMap = key;
        persistSave();
        // refresh menu scene with new map theme
        if(menuScene) buildMenuScene();
        goMenu();
      } else {
        if(Save.coins >= map.cost){
          Save.coins -= map.cost;
          Save.ownedMaps.push(key);
          Save.selectedMap = key;
          persistSave();
          updateCoinDisplays();
          renderMaps();
        } else {
          btn.textContent = 'НЕ ХВАТАЕТ 💰';
          setTimeout(() => renderMaps(), 1200);
        }
      }
    };
    card.onclick = () => btn.click();
    grid.appendChild(card);
  }
}

/* ============================ NAVIGATION ============================ */
document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-nav]');
  if(!btn) return;
  const nav = btn.dataset.nav;
  if(nav === 'menu'){ goMenu(); }
  else if(nav === 'garage'){ goGarage(); }
  else if(nav === 'shop'){ goShop(); }
  else if(nav === 'leaderboard'){ goLeaderboard(); }
  else if(nav === 'maps'){ goMaps(); }
  else if(nav === 'race'){ startRace(Save.selectedMap); }
  else if(nav === 'race-again'){ startRace(currentMapKey); }
  else if(nav === 'resume'){ $('pause-modal').classList.remove('active'); }
  else if(nav === 'restart'){ $('pause-modal').classList.remove('active'); startRace(currentMapKey); }
});

document.querySelectorAll('.shop-tabs button').forEach(b => {
  b.addEventListener('click', () => renderShop(b.dataset.tab));
});

$('pause-btn').addEventListener('click', () => {
  if(activeScreen === 'racing') $('pause-modal').classList.add('active');
});

// garage drag rotation
addEventListener('mousedown', e => {
  if(activeScreen === 'garage' && !e.target.closest('.garage-panel') && !e.target.closest('.back-btn')){
    garageDragging = true;
    garageLastX = e.clientX;
  }
});
addEventListener('mouseup', () => garageDragging = false);
addEventListener('mousemove', e => {
  if(garageDragging && activeScreen === 'garage'){
    garageRotY += (e.clientX - garageLastX) * 0.012;
    garageLastX = e.clientX;
    if(garageBike) garageBike.rotation.y = garageRotY;
  }
});

function updateCoinDisplays(){
  const s = Save.coins.toString();
  ['coins-menu','coins-garage','coins-shop','coins-maps'].forEach(id => {
    const el = $(id);
    if(el) el.textContent = s;
  });
}

/* ============================ MAIN LOOP ============================ */
let lastTime = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.25) dt = 0.25;

  if(activeScreen === 'racing' && currentScene === raceScene && raceCamera){
    accumulator += dt;
    let steps = 0;
    while(accumulator >= FIXED_DT && steps < 10){
      stepPhysics(FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
    }
    if(steps >= 10) accumulator = 0;
    for(const b of bikes) syncBikeMesh(b);
    updateRaceCamera(dt);
    updateHUD(dt);
    renderer.render(raceScene, raceCamera);
  } else if(activeScreen === 'garage' && garageScene){
    if(garageBike){
      garageBike.position.y = Math.sin(now*0.0015) * 0.035;
      garageBike.rotation.y = garageRotY;
    }
    renderer.render(garageScene, garageCamera);
  } else {
    // menu / shop / leaderboard / maps all show the menu scene behind
    if(menuScene && menuCamera){
      if(menuBike){
        menuBike.rotation.y += dt * 0.4;
        menuBike.position.y = Math.sin(now*0.0012) * 0.06;
      }
      if(menuParticles){
        for(const p of menuParticles){
          p.position.y += p.userData.v * dt * 0.5;
          p.position.x += Math.sin(now*0.0005 + p.userData.o) * dt * 0.2;
          if(p.position.y > 7){ p.position.y = 0; }
        }
      }
      renderer.render(menuScene, menuCamera);
    }
  }
}

/* ============================ BOOT ============================ */
updateCoinDisplays();
buildMenuScene();
currentScene = menuScene;
currentCamera = menuCamera;
showScreen('menu');
animate();
</script>
